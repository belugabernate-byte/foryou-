<!DOCTYPE html>
<html lang="en">
<head>
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>

    <link rel="stylesheet" href="mydesign.css">
</head>
<body>

    <div class="container">

        <div id="page1" class="page active">
            <h1>hey baby! 💕</h1>

            <p>i have something special for you...</p>

            <div class="buttons">
                <button id="yesBtn">yes ❤️</button>
                <button id="noBtn">no 😢</button>
            </div>
        </div>

        <div id="page2" class="page">
            <h1>🌹</h1>

            <h2>these flowers are for you</h2>

            <p>because you deserve something beautiful every single day.</p>

            <button id="nextBtn">continue 💌</button>
        </div>

        <div id="page3" class="page">
            <h1>happy birthday, my love ❤️</h1>

            <div class="letter">
                <p id="typing"></p>
            </div>
        </div>


</div>


<div class="scrapbook">
    <img src="assets/pic1.jpg" class="photo p1">
    <img src="assets/pic2.jpg" class="photo p2">
    <img src="assets/pic3.jpg" class="photo p3">
    <img src="assets/pic4.jpg" class="photo p4">
    <img src="assets/pic5.jpg" class="photo p5">
    <img src="assets/pic6.jpg" class="photo p6">
    <img src="assets/pic7.jpg" class="photo p7">
    <img src="assets/pic8.jpg" class="photo p8">
    <img src="assets/pic9.jpg" class="photo p9">
    <img src="assets/pic10.jpg" class="photo p10">

    <img src="assets/bow.png" class="bow">
</div>



<audio id="bgMusic" loop>
    <source src="assets/Last Night on Earth.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
</audio>

<script src="jav.js"></script>
</body>
</html>
